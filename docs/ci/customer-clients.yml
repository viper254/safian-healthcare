name: Customer client staging builds

on:
  workflow_dispatch:
  pull_request:
    branches: [multi-client-isolated-development]
    paths: ["apps/customer_flutter/**", ".github/workflows/customer-clients.yml"]

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-internal-apk:
    needs: analyse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: safian-customer-android-debug-apk
          path: apps/customer_flutter/build/app/outputs/flutter-apk/app-debug.apk

  linux-deb:
    needs: analyse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: chmod +x tool/package_linux_deb.sh && tool/package_linux_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: safian-customer-linux-deb
          path: apps/customer_flutter/build/*.deb

  windows-exe:
    needs: analyse
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/customer_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: safian-customer-windows-exe-bundle
          path: apps/customer_flutter/build/windows/x64/runner/Release

  ios-testflight-preflight:
    needs: analyse
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/customer_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Signing notice
        run: echo "No IPA is published by this workflow. Configure Apple signing and App Store Connect only after staging approval."
